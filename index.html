<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Welcome Home Inspections</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{font-family:Inter,system-ui,sans-serif;color:#1a1a1a}
.nav{background:#000;color:#fff;position:sticky;top:0;z-index:20}
.wrap{width:min(1180px,calc(100% - 32px));margin:auto}
.nav-inner{display:flex;align-items:center;justify-content:space-between;min-height:80px;gap:12px}
.brand img{height:52px;width:auto;display:block}
.nav-links{display:none;gap:20px;font-size:14px}
.nav-links a{color:#eee;text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:12px 18px;text-decoration:none;font-weight:600;font-size:14px;min-height:44px}
.btn-red{background:#e11d2e;color:#fff}
.btn-glass{border:1px solid rgba(255,255,255,.35);color:#fff}
.hero{position:relative;min-height:calc(100svh - 80px);color:#fff;display:grid;align-items:end}
.hero img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.2),rgba(0,0,0,.75))}
.hero-copy{position:relative;z-index:1;padding:40px 0 36px;max-width:820px}
.pill{display:inline-block;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
h1{font-family:"Playfair Display",Georgia,serif;font-size:clamp(2.3rem,7vw,4.4rem);line-height:1.05}
h1 em{font-style:italic;color:#e11d2e}
.lede{margin:16px 0 24px;max-width:38rem}
.actions,.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:10px 12px;font-size:12px;font-weight:600}
section{padding:64px 0}
.cream{background:#f6f3ef}
.dark{background:#0b0b0b;color:#f3eee8}
h2{font-family:"Playfair Display",Georgia,serif;font-size:clamp(1.7rem,4vw,2.6rem);margin:8px 0 16px}
.grid{display:grid;gap:14px}
article{background:#fff;border:1px solid #ece7e1;border-radius:16px;padding:20px}
.dark article{background:#161616;border-color:#2a2a2a}
.footer{background:#000;color:#bbb;padding:36px 0}
.menu-btn{background:none;border:0;color:#fff;font-size:22px}
.panel{display:none;background:#000;padding:8px 16px 16px}
.panel.open{display:block}
.panel a{display:block;color:#eee;padding:12px 0;text-decoration:none;border-bottom:1px solid #222}
@media(min-width:900px){.nav-links{display:flex}.menu-btn,.panel{display:none!important}.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:899px){.actions .btn{width:100%}}
</style></head>
<body>
<!-- SOURCE: artifacts/welcome-home-inspections DEMO.html -->
</body></html>
